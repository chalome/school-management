{% load static %}
<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Récupération du compte</title><link rel="stylesheet" href="{% static 'core/app.css' %}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="{% url 'login' %}"><span class="brand-mark">♥</span><span><strong>Petit Enfant</strong><small>Grand Cœur Burundi</small></span></a><h1>Récupérer l’accès</h1><p>Indiquez l’adresse e-mail associée à votre compte.</p>
{% if form.errors %}<div class="form-errors">{{ form.errors }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="{{ form.email.id_for_label }}">E-mail professionnel</label>{{ form.email }}</div><button class="button" type="submit">Envoyer le lien sécurisé</button></form><p style="margin-top:18px"><a href="{% url 'login' %}">Retour à la connexion</a></p></main></body></html>
